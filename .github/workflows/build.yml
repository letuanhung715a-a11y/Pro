name: Build Tweak
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: unzip "Fake MigulV2.zip" -d out
      - name: Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH
      - name: SDK
        run: |
          curl -L https://github.com/theos/sdks/archive/master.tar.gz | tar -xz
          mv sdks-master/*.sdk $HOME/theos/sdks/
      - name: ldid
        run: brew install ldid
      - name: Build
        run: |
          cd out/Wwww-main-master
          make clean && make package
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: tweak
          path: out/Wwww-main-master/packages/*.deb
